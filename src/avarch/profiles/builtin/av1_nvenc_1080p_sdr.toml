schema_version = 1
name = "av1_nvenc_1080p_sdr"
description = "Conservative NVIDIA NVENC AV1 1080p SDR archival profile."
tags = ["sdr", "1080p", "av1", "nvenc", "gpu"]

known_limitations = [
  "Requires an NVIDIA GPU with AV1 NVENC support and a compatible driver.",
  "NVENC CQ values are not comparable to SVT-AV1 CRF values.",
  "Interrupted video encoding restarts from the beginning.",
  "Does not deinterlace.",
]

backend = "ffmpeg_nvenc"
container = "mkv"

[match]
video_codec_not = ["av1"]

[video]
max_width = 1920
hdr_to_sdr = true
source = "vapoursynth"

[nvenc]
encoder = "av1_nvenc"
preset = "p5"
tune = "hq"
cq = 28
multipass = "qres"
lookahead = 16
spatial_aq = true
temporal_aq = true
aq_strength = 8
gpu = 0
pixel_format = "p010le"

[audio]
codec = "libopus"
bitrate = "128k"
channels = 2
languages = ["eng"]

[subtitles]
languages = ["eng"]
keep_forced = true

[validation]
duration_tolerance_seconds = 2.0
minimum_output_bytes = 1024
minimum_output_source_ratio = 0.01
decode_sample = false
decode_sample_seconds = 5.0

[promotion]
require_smaller = true
minimum_savings_percent = 5
delete_rejected_output = true
