name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  build:
    name: Build
    needs: test
    uses: ./.github/workflows/docker-build.yml
    with:
      dockerhub_repository: ${{ vars.DOCKERHUB_REPOSITORY }}

  sbom:
    name: SBOM
    needs: build
    uses: ./.github/workflows/sbom.yml
    with:
      image_artifact: ${{ needs.build.outputs.image_artifact }}

  security:
    name: Security
    needs: build
    uses: ./.github/workflows/security.yml
    with:
      image_artifact: ${{ needs.build.outputs.image_artifact }}

  docker-push:
    name: Docker Push
    if: needs.build.outputs.push_image == 'true'
    needs:
      - build
      - sbom
      - security
    uses: ./.github/workflows/docker-push.yml
    with:
      dockerhub_tags: ${{ needs.build.outputs.dockerhub_tags }}
      image_artifact: ${{ needs.build.outputs.image_artifact }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
